name: BUSF Quality Screen

on:
  schedule:
    - cron: '0 14 * * 6'   # Szombat 14:00 UTC = 16:00 Budapest
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas lxml html5lib beautifulsoup4 yfinance

      - name: Run BUSF screen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cd busf
          python src/run.py

      - name: Commit cache and results
        run: |
          git config user.name  "busf-bot"
          git config user.email "busf-bot@users.noreply.github.com"
          git add busf/data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "BUSF $(date -u +%Y-%m-%d)"
            git push
          fi

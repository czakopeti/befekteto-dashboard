name: Squeeze Scanner

on:
  schedule:
    - cron: '0 6 * * 1-5'   # H-P 06:00 UTC = 08:00 Budapest
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install yfinance pandas numpy requests

      - name: Run Squeeze Scanner
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python squeeze_scanner.py

      - name: Save results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add squeeze_results.json squeeze_state.json || true
          git diff --staged --quiet || git commit -m "Squeeze scan $(date +'%Y-%m-%d')"
          git push || true

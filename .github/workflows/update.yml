name: Update Befekteto Dashboard

on:
  schedule:
    - cron: '0 15 * * 5'   # Péntek 15:00 UTC = 17:00 Budapest (CEST)
  workflow_dispatch:         # Manuális trigger – bármikor futtatható

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas requests

      - name: Run Quality Screener
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python screener.py

      - name: Run Dashboard Update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY:  ${{ secrets.FMP_API_KEY }}
        run: python auto_update.py

      - name: Commit and Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Dashboard v5 frissítés $(date +'%Y-%m-%d %H:%M')"
          git push

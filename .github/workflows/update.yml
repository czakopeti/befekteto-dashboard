name: Befektető Dashboard – Heti Frissítés

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Kód letöltése
        uses: actions/checkout@v4

      - name: Python beállítása
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Csomagok telepítése
        run: pip install yfinance requests pandas openpyxl --quiet

      - name: Dashboard frissítése
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python auto_update.py --no-browser

      - name: Fallback fájlok ha script crashelt
        if: always()
        run: |
          if [ ! -f error_log.json ]; then
            echo '{"last_run":"'$(date -u +%Y-%m-%dT%H:%M:%S)'","status":"CRASHED","errors":[{"source":"script","error":"Script crashed before error_log was created. Check FRED_API_KEY secret!"}],"success_count":0}' > error_log.json
          fi
          if [ ! -f index.html ]; then
            echo '<html><body style="font-family:monospace;background:#03050a;color:#c0d0e8;padding:40px"><h1>Dashboard frissítés sikertelen</h1><p>Futtasd újra manuálisan: Actions → Run workflow</p><p>Leggyakoribb ok: FRED_API_KEY secret nincs beállítva</p></body></html>' > index.html
          fi

      - name: Eredmény commitolása
        if: always()
        run: |
          git config --local user.email "dashboard@auto.update"
          git config --local user.name "Auto Update"
          git add -f index.html error_log.json 2>/dev/null || true
          git add history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto update: $(date '+%Y-%m-%d %H:%M')"
          git push

      - name: Error log artifact mentése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: error_log.json
          retention-days: 30
          if-no-files-found: warn


       

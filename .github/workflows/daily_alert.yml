name: Daily Alert Check

on:
  schedule:
    - cron: '0 6 * * *'     # Minden nap 6:00 UTC = 8:00 Budapest (CEST)
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas requests

      - name: Run daily alert check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NTFY_TOPIC:   ${{ secrets.NTFY_TOPIC }}
        run: python daily_alert.py

      - name: Save alert state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json || true
          git diff --staged --quiet || git commit -m "Alert state $(date +'%Y-%m-%d')"
          git push || true
